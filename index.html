    // ========================================================================
    // USER LIST MODAL (Interactive Followers & Following lists with search & toggle)
    // ========================================================================
    const UserListModal = ({ title, users = [], currentUser, onClose, onSelectUser, onToggleFollow }) => {
      const [search, setSearch] = useState('');

      const filtered = users.filter(u => 
        u.name.toLowerCase().includes(search.toLowerCase()) || 
        u.username.toLowerCase().includes(search.toLowerCase()) ||
        (u.institution && u.institution.toLowerCase().includes(search.toLowerCase())) ||
        (u.field && u.field.toLowerCase().includes(search.toLowerCase()))
      );

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white dark:bg-slate-900 rounded-3xl max-w-md w-full border border-slate-200 dark:border-slate-800 shadow-2xl flex flex-col max-h-[80vh] overflow-hidden">
            {/* Header */}
            <div className="p-4 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between">
              <div>
                <h3 className="font-extrabold text-sm text-slate-900 dark:text-white">{title}</h3>
                <p className="text-[11px] text-slate-400">{users.length} scholars</p>
              </div>
              <button onClick={onClose} className="p-1 rounded-lg text-slate-400 hover:text-slate-600">
                <Icon name="x" className="w-5 h-5" />
              </button>
            </div>

            {/* Search */}
            <div className="p-3 border-b border-slate-100 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/40">
              <div className="relative">
                <Icon name="search" className="w-4 h-4 absolute left-3 top-2.5 text-slate-400" />
                <input 
                  type="text"
                  value={search}
                  onChange={(e) => setSearch(e.target.value)}
                  placeholder="Filter scholars by name, university, discipline..."
                  className="w-full pl-9 pr-3 py-1.5 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-xs focus:outline-none"
                />
              </div>
            </div>

            {/* List */}
            <div className="flex-1 overflow-y-auto p-4 space-y-3">
              {filtered.map(u => {
                const isMe = currentUser && currentUser.id === u.id;
                const isFollowing = currentUser && (currentUser.followingIds || []).includes(u.id);

                return (
                  <div key={u.id} className="flex items-center justify-between gap-3 p-2 rounded-xl hover:bg-slate-50 dark:hover:bg-slate-800/60 transition">
                    <div 
                      onClick={() => onSelectUser(u)}
                      className="flex items-center gap-3 cursor-pointer min-w-0 flex-1"
                    >
                      <img src={u.avatar} alt={u.name} className="w-10 h-10 rounded-full object-cover shrink-0 border border-slate-200 dark:border-slate-700" />
                      <div className="min-w-0">
                        <div className="flex items-center gap-1.5">
                          <span className="font-bold text-xs text-slate-900 dark:text-white truncate hover:underline">{u.name}</span>
                          {u.verified && <span className="text-[10px] text-blue-500 font-bold">✓</span>}
                        </div>
                        <p className="text-[10px] text-slate-400 truncate">@{u.username} • {u.institution || 'Independent'}</p>
                        {u.field && <p className="text-[10px] text-slate-500 truncate">{u.field}</p>}
                      </div>
                    </div>

                    {!isMe && currentUser && (
                      <button 
                        onClick={() => onToggleFollow(u.id)}
                        className={`px-3 py-1 rounded-lg text-xs font-semibold shrink-0 transition ${
                          isFollowing 
                            ? 'border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-rose-50 hover:text-rose-600'
                            : 'bg-brand-600 hover:bg-brand-500 text-white'
                        }`}
                      >
                        {isFollowing ? 'Following' : '+ Follow'}
                      </button>
                    )}
                  </div>
                );
              })}

              {filtered.length === 0 && (
                <div className="text-center py-8 text-xs text-slate-400">
                  No scholars found matching your filter.
                </div>
              )}
            </div>
          </div>
        </div>
      );
    };

    // ========================================================================
    // BOOK DETAILS MODAL (Synopsis, Syllabus, Reader launch, Public Domain notice)
    // ========================================================================
    const BookDetailsModal = ({ book, onClose, onOpenReader, currentUser, onShowToast }) => {

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white dark:bg-slate-900 rounded-3xl max-w-2xl w-full border border-slate-200 dark:border-slate-800 shadow-2xl flex flex-col max-h-[90vh] overflow-hidden">
            {/* Header */}
            <div className="p-4 sm:p-5 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between">

                  {book.categoryLabel || "Public Domain Classic"}
                </span>
                <span className="text-slate-400 text-xs">•</span>
                <span className="text-[11px] text-slate-500 font-mono">{book.year}</span>

              <button onClick={onClose} className="p-1 rounded-lg text-slate-400 hover:text-slate-600">
                <Icon name="x" className="w-5 h-5" />
              </button>
            </div>

            {/* Content */}
            <div className="p-6 overflow-y-auto space-y-6 flex-1">
              {/* Main Book Hero */}
              <div className="flex flex-col sm:flex-row gap-5 items-start">
                <img 
                  src={book.cover} 
                  alt={book.title} 
                  className="w-28 sm:w-36 h-40 sm:h-52 object-cover rounded-xl shadow-lg border border-slate-200 dark:border-slate-700 shrink-0 mx-auto sm:mx-0" 
                />
                <div className="space-y-2 text-center sm:text-left flex-1">
                  <h2 className="text-xl sm:text-2xl font-black text-slate-900 dark:text-white leading-tight">
                    {book.title}
                  </h2>
                  <p className="text-sm font-semibold text-brand-600 dark:text-blue-400">

                  <div className="flex flex-wrap gap-2 pt-1 justify-center sm:justify-start text-[11px] text-slate-500">

                    <span className="px-2 py-0.5 bg-slate-100 dark:bg-slate-800 rounded-md">🏛️ Public Domain</span>

                  {/* Progress if started */}
                  {userProgress > 0 && (
                    <div className="pt-2">
                      <div className="flex justify-between text-[11px] text-slate-500 mb-1">

                        <span className="font-bold text-brand-600">{userProgress}%</span>

                        <div className="bg-brand-600 h-full" style={{ width: `${userProgress}%` }} />
                      </div>
                    </div>
                  )}

                  {/* Action Buttons */}
                  <div className="flex flex-wrap gap-2.5 pt-3 justify-center sm:justify-start">
                    <button

                      className="px-5 py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white dark:bg-brand-600 dark:hover:bg-brand-500 text-xs font-bold shadow flex items-center gap-2"
                    >
                      <Icon name="book" className="w-4 h-4 text-amber-300" />
                      <span>{userProgress > 0 ? "Continue Reading" : "Start Reading Online"}</span>

                      onClick={() => {
                        store.toggleBookmarkBook(book.id);
                        onShowToast(isSaved ? "Removed from reading shelf." : "Saved to your Reading Shelf 🔖");

                        isSaved ? 'bg-amber-50 border-amber-300 text-amber-700 dark:bg-amber-950/40 dark:border-amber-800 dark:text-amber-400' : 'border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 hover:bg-slate-50'
                      }`}
                    >
                      <Icon name="bookmark" className="w-4 h-4" />

                <strong>🏛️ Scholarly Legal Notice:</strong> This volume is preserved in the public domain and authorized for free browser reading. In accordance with open licensing policies, direct PDF/EPUB file downloading is restricted to protect academic integrity.
              </div>

              {/* Synopsis */}
              <div className="space-y-2">
                <h4 className="font-bold text-xs uppercase tracking-wider text-slate-400">Scholarly Synopsis</h4>
                <p className="text-xs text-slate-700 dark:text-slate-300 leading-relaxed font-sans whitespace-pre-line">
                  {book.description}

                <h4 className="font-bold text-xs uppercase tracking-wider text-slate-400">Chapters & Syllabus</h4>
                <div className="space-y-1.5 border border-slate-200 dark:border-slate-800 rounded-xl overflow-hidden divide-y divide-slate-100 dark:divide-slate-800">

                    <div 
                      key={idx}
                      onClick={() => onOpenReader(book)}
                      className="p-3 hover:bg-slate-50 dark:hover:bg-slate-800/60 cursor-pointer flex items-center justify-between text-xs transition"
                    >
                      <div className="flex items-center gap-2.5 min-w-0">

                        <span className="font-semibold text-slate-800 dark:text-slate-200 truncate">{ch.title}</span>

            </div>
          </div>
        </div>
      );

    // ========================================================================
    // ARTICLE DETAIL MODAL (Dedicated Full Reading Page for Articles & Preprints)
    // ========================================================================
    const ArticleDetailModal = ({ post, currentUser, onClose, onRequireAuth, onShowToast, onOpenComments, onOpenRepost, onReportPost, onEditPost }) => {
      const [inlineComment, setInlineComment] = useState('');
      
      const isLiked = currentUser && (post.likes || []).includes(currentUser.id);
      const isReposted = currentUser && (post.reposts || []).includes(currentUser.id);
      const isBookmarked = currentUser && (currentUser.savedPostIds || []).includes(post.id);
      const isAuthor = currentUser && (currentUser.id === post.authorId || currentUser.role === 'admin');

      const handleInlineComment = () => {
        if (!onRequireAuth("comment")) return;
        if (!inlineComment.trim()) return;
        store.addComment(post.id, inlineComment);
        setInlineComment('');
        onShowToast("Comment published to academic discussion.");
      };

      const handleCopyLink = () => {
        navigator.clipboard?.writeText?.(window.location.href);
        onShowToast("Article permalink copied to clipboard 📋");
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-md flex items-center justify-center p-2 sm:p-4">
          <div className="bg-white dark:bg-slate-900 rounded-3xl max-w-3xl w-full border border-slate-200 dark:border-slate-800 shadow-2xl flex flex-col max-h-[95vh] overflow-hidden">
            {/* Top Navigation Bar */}
            <div className="px-6 py-4 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <button 
                  onClick={onClose} 
                  className="p-1.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500 font-bold text-xs flex items-center gap-1"
                >
                  ← Back
                </button>
                <span className="px-2 py-0.5 rounded bg-blue-100 text-blue-800 dark:bg-blue-900/60 dark:text-blue-300 text-[10px] font-bold uppercase tracking-wider">
                  {post.categoryLabel || "Academic Publication"}
                </span>
              </div>

              <div className="flex items-center gap-2">
                {isAuthor && onEditPost && (
                  <button 
                    onClick={() => onEditPost(post)}
                    className="px-3 py-1 rounded-lg border border-slate-200 dark:border-slate-700 text-xs font-semibold hover:bg-slate-100"
                  >
                    ✏️ Edit
                  </button>
                )}
                <button 
                  onClick={handleCopyLink} 
                  className="p-1.5 rounded-lg text-slate-400 hover:text-slate-600"
                  title="Copy Shareable Link"
                >
                  <Icon name="share" className="w-4 h-4" />
                </button>
                <button onClick={onClose} className="p-1 rounded-lg text-slate-400 hover:text-slate-600">
                  <Icon name="x" className="w-5 h-5" />
                </button>
              </div>
            </div>

            {/* Article Body */}
            <div className="p-6 sm:p-10 overflow-y-auto space-y-6 flex-1">
              {/* Author Badge */}
              <div className="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 pb-5">
                <div className="flex items-center gap-3.5">
                  <img src={post.authorAvatar} alt={post.authorName} className="w-12 h-12 rounded-full object-cover border border-slate-200 dark:border-slate-700" />
                  <div>
                    <h4 className="font-extrabold text-sm text-slate-900 dark:text-white">{post.authorName}</h4>
                    <p className="text-xs text-slate-500">{post.authorInstitution || 'Scholar'} • @{post.authorUsername}</p>
                    <div className="flex items-center gap-2 text-[11px] text-slate-400 mt-0.5">
                      <span>{post.timestamp}</span>
                      <span>•</span>
                      <span>{post.readingTime}</span>
                    </div>
                  </div>
                </div>
                
                {currentUser && currentUser.id !== post.authorId && (
                  <button
                    onClick={() => {
                      store.toggleFollow(post.authorId);
                      onShowToast("Follow relationship updated.");
                    }}
                    className="px-3.5 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700 text-xs font-semibold hover:bg-slate-50"
                  >
                    {store.isFollowing(post.authorId) ? "Following" : "+ Follow"}
                  </button>
                )}
              </div>

              {/* Bold Title - Requirement: Title MUST appear before content */}
              <h1 className="text-2xl sm:text-3xl font-black text-slate-900 dark:text-white leading-tight font-sans">
                {post.title}
              </h1>

              {/* Research Preprint Box if applicable */}
              {post.abstract && (
                <div className="p-5 rounded-2xl bg-blue-50/60 dark:bg-blue-950/20 border border-blue-200 dark:border-blue-900/60 space-y-3">
                  <span className="text-[10px] font-bold text-blue-800 dark:text-blue-300 uppercase tracking-wider block">
                    🔬 Abstract / Executive Summary
                  </span>
                  <p className="text-xs text-slate-700 dark:text-slate-300 leading-relaxed italic font-serif">
                    "{post.abstract}"
                  </p>
                  {post.keywords && post.keywords.length > 0 && (
                    <div className="flex flex-wrap gap-1.5 pt-1">
                      {post.keywords.map((k, i) => (
                        <span key={i} className="text-[10px] px-2 py-0.5 rounded-md bg-white dark:bg-slate-900 border border-blue-200 dark:border-blue-800 text-blue-700 dark:text-blue-300 font-medium">
                          #{k}
                        </span>
                      ))}
                    </div>
                  )}
                </div>
              )}

              {/* Article Full Text */}
              <div className="text-sm sm:text-base leading-relaxed text-slate-800 dark:text-slate-200 font-serif whitespace-pre-line space-y-4">
                {post.content}
              </div>

              {/* Attached Image Figure */}
              {post.image && (
                <div className="pt-2">
                  <img src={post.image} alt={post.title} className="w-full max-h-96 object-cover rounded-2xl shadow-md border border-slate-200 dark:border-slate-800" />
                  <p className="text-[11px] text-slate-400 text-center mt-1.5 italic">Figure 1. Accompanying scholarly diagram / visual dataset.</p>
                </div>
              )}

              {/* Citations & References */}
              {post.citations && post.citations.length > 0 && (
                <div className="pt-4 border-t border-slate-100 dark:border-slate-800 space-y-2 text-xs">
                  <h5 className="font-bold uppercase tracking-wider text-slate-400">References & Bibliography</h5>
                  <ol className="list-decimal list-inside space-y-1 text-slate-600 dark:text-slate-400 font-mono text-[11px]">
                    {post.citations.map((c, i) => (
                      <li key={i}>{c}</li>
                    ))}
                  </ol>
                </div>
              )}

              {/* Action Toolbar */}
              <div className="pt-6 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between text-xs">
                <div className="flex items-center gap-3">
                  <button 
                    onClick={() => {
                      if (onRequireAuth("like")) store.toggleLike(post.id);
                    }}
                    className={`flex items-center gap-1.5 px-3 py-1.5 rounded-xl border transition ${
                      isLiked ? 'bg-rose-50 border-rose-200 text-rose-600 dark:bg-rose-950/40 dark:border-rose-900' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-50'
                    }`}
                  >
                    <Icon name="heart" className={`w-4 h-4 ${isLiked ? 'fill-rose-500 text-rose-500' : ''}`} />
                    <span className="font-bold">{post.likesCount || 0}</span>
                  </button>

                  <button 
                    onClick={() => onOpenComments(post)}

                  >
                    <Icon name="comment" className="w-4 h-4" />
                    <span className="font-bold">{post.commentsCount || 0}</span>
                  </button>

                  <button 
                    onClick={() => onOpenRepost(post)}
                    className={`flex items-center gap-1.5 px-3 py-1.5 rounded-xl border transition ${
                      isReposted ? 'bg-emerald-50 border-emerald-200 text-emerald-600 dark:bg-emerald-950/40 dark:border-emerald-900' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-50'
                    }`}
                  >
                    <Icon name="repost" className="w-4 h-4" />
                    <span className="font-bold">{post.repostsCount || 0}</span>
                  </button>
                </div>

                <div className="flex items-center gap-2">
                  <button 
                    onClick={() => {
                      if (onRequireAuth("bookmark")) {
                        store.toggleBookmarkPost(post.id);
                        onShowToast(isBookmarked ? "Removed from bookmarks." : "Article saved to your Dashboard 🔖");
                      }
                    }}
                    className={`p-2 rounded-xl border ${isBookmarked ? 'bg-amber-50 border-amber-300 text-amber-600' : 'border-slate-200 dark:border-slate-700 text-slate-500'}`}
                    title="Save Article"
                  >
                    <Icon name="bookmark" className="w-4 h-4" />
                  </button>

                  <button 
                    onClick={() => onReportPost(post)}
                    className="p-2 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-400 hover:text-rose-500"
                    title="Report Post"
                  >
                    <Icon name="flag" className="w-4 h-4" />
                  </button>
                </div>
              </div>

              {/* Inlined Discussion Section */}
              <div className="pt-6 border-t border-slate-100 dark:border-slate-800 space-y-4">
                <h4 className="font-bold text-sm text-slate-900 dark:text-white">
                  Academic Peer Review & Discussion ({(post.comments || []).length})
                </h4>

                {/* Inlined Comment Box */}
                <div className="flex gap-2">
                  <input 
                    type="text"
                    value={inlineComment}
                    onChange={(e) => setInlineComment(e.target.value)}
                    onKeyDown={(e) => e.key === 'Enter' && handleInlineComment()}
                    placeholder="Contribute scholarly commentary or questions..."
                    className="flex-1 p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs text-slate-900 dark:text-white focus:outline-none"
                  />
                  <button 
                    onClick={handleInlineComment}
                    className="px-4 py-2 rounded-xl bg-slate-900 text-white dark:bg-brand-600 text-xs font-bold shrink-0"
                  >
                    Comment
                  </button>
                </div>

                {/* Comments List */}
                <div className="space-y-3 pt-2">
                  {(post.comments || []).map(c => (
                    <div key={c.id} className="p-3 rounded-xl bg-slate-50 dark:bg-slate-800/60 border border-slate-100 dark:border-slate-800 text-xs space-y-1.5">
                      <div className="flex items-center gap-2">
                        <img src={c.authorAvatar} alt={c.authorName} className="w-6 h-6 rounded-full object-cover" />
                        <div>
                          <span className="font-bold text-slate-900 dark:text-white">{c.authorName}</span>
                          <span className="text-[10px] text-slate-400 ml-1">@{c.authorUsername}</span>
                        </div>
                      </div>
                      <p className="text-slate-700 dark:text-slate-300 font-sans leading-relaxed pl-8">
                        {c.text}
                      </p>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // ========================================================================
    // STREAK HISTORY & MILESTONES MODAL (Non-shaming 30-day matrix & milestone badges)
    // ========================================================================
    const StreakHistoryModal = ({ currentUser, onClose }) => {
      if (!currentUser) return null;

      const currentStreak = currentUser.streakDays || 1;
      const milestones = BRAND_CONFIG.streakMilestones || [];

      // Generate 30 day matrix representation
      const days = [];
      const today = new Date();
      for (let i = 29; i >= 0; i--) {
        const d = new Date(today);
        d.setDate(today.getDate() - i);
        const dateStr = d.toISOString().split('T')[0];
        const isCompleted = i < currentStreak; // verified streak
        days.push({
          dateStr,
          dayNum: d.getDate(),
          month: d.toLocaleString('default', { month: 'short' }),
          completed: isCompleted,
          isToday: i === 0
        });
      }

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white dark:bg-slate-900 rounded-3xl max-w-lg w-full border border-slate-200 dark:border-slate-800 shadow-2xl flex flex-col max-h-[90vh] overflow-hidden text-xs">
            {/* Header */}
            <div className="p-5 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between">
              <div className="flex items-center gap-2">
                <span className="text-xl">🔥</span>
                <div>
                  <h3 className="font-extrabold text-base text-slate-900 dark:text-white">Daily Learning Streak & Activity</h3>
                  <p className="text-[11px] text-slate-400">Verified Scholarly Consistency</p>
                </div>
              </div>
              <button onClick={onClose} className="p-1 rounded-lg text-slate-400 hover:text-slate-600">
                <Icon name="x" className="w-5 h-5" />
              </button>
            </div>

            {/* Body */}
            <div className="p-6 overflow-y-auto space-y-6 flex-1">
              {/* Main Streak Card */}
              <div className="p-5 rounded-2xl bg-gradient-to-br from-amber-500/10 via-orange-500/5 to-transparent border border-amber-300 dark:border-amber-800/80 text-center space-y-2">
                <span className="text-4xl block animate-bounce">🔥</span>
                <h2 className="text-2xl font-black text-amber-700 dark:text-amber-400 font-sans">
                  {currentStreak}-Day Learning Streak
                </h2>
                <p className="text-slate-600 dark:text-slate-300 max-w-sm mx-auto leading-relaxed">
                  {currentUser.streakCompletedToday 
                    ? "You have already completed a verified learning activity today! Your streak is secured."
                    : "Complete a verified learning activity today (15s+ reading session or published post/comment) to continue your progress."}
                </p>
              </div>

              {/* 30-Day Activity Heatmap Grid */}
              <div className="space-y-2">
                <div className="flex items-center justify-between">
                  <h4 className="font-bold text-slate-900 dark:text-white uppercase tracking-wider text-[11px]">
                    30-Day Activity History
                  </h4>
                  <span className="text-[10px] text-slate-400">Past 30 days</span>
                </div>
                <div className="grid grid-cols-6 sm:grid-cols-10 gap-1.5 p-3 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700/80">
                  {days.map((d, i) => (
                    <div 
                      key={i} 
                      title={`${d.month} ${d.dayNum}: ${d.completed ? 'Verified Learning Activity' : 'Rest day'}`}
                      className={`h-8 rounded-lg flex flex-col items-center justify-center text-[9px] font-mono transition ${
                        d.completed 
                          ? 'bg-amber-500 text-white font-bold shadow-sm' 
                          : d.isToday 
                            ? 'border-2 border-dashed border-amber-400 text-amber-600 dark:text-amber-400' 
                            : 'bg-slate-200 dark:bg-slate-700/50 text-slate-400'
                      }`}
                    >
                      <span>{d.dayNum}</span>
                    </div>
                  ))}
                </div>
                <p className="text-[10px] text-slate-400 italic">
                  Note: Scholaria believes in sustainable learning. Missed days are never penalized or shamed.
                </p>
              </div>

              {/* Qualifying Activity Policy */}
              <div className="p-3.5 rounded-xl bg-blue-50/60 dark:bg-blue-950/20 border border-blue-200 dark:border-blue-900 space-y-1.5">
                <h5 className="font-bold text-blue-900 dark:text-blue-300 text-[11px]">
                  What counts as a qualifying learning activity?
                </h5>
                <ul className="list-disc list-inside space-y-0.5 text-[11px] text-slate-600 dark:text-slate-400">
                  <li>Reading books or chapters in the Online Library (verified active session)</li>
                  <li>Publishing an academic article, research preprint, or study note</li>
                  <li>Contributing constructive peer review or academic comments</li>
                  <li className="text-slate-400">Simply opening or refreshing the app does NOT qualify.</li>
                </ul>
              </div>

              {/* Milestone Badges */}
              <div className="space-y-2">
                <h4 className="font-bold text-slate-900 dark:text-white uppercase tracking-wider text-[11px]">
                  Milestone Recognition Badges
                </h4>
                <div className="grid grid-cols-2 gap-2.5">
                  {milestones.map(m => {
                    const unlocked = currentStreak >= m.days;
                    return (
                      <div 
                        key={m.days}
                        className={`p-3 rounded-xl border flex items-center gap-3 transition ${
                          unlocked 
                            ? 'bg-amber-50/60 dark:bg-amber-950/30 border-amber-300 dark:border-amber-800' 
                            : 'border-slate-200 dark:border-slate-800 opacity-60'
                        }`}
                      >
                        <span className="text-2xl">{m.badge}</span>
                        <div>
                          <h5 className="font-bold text-slate-900 dark:text-white leading-tight">{m.title}</h5>
                          <p className="text-[10px] text-slate-400 mt-0.5">{m.days} Days Streak</p>
                          <span className={`text-[9px] font-bold uppercase tracking-wider ${unlocked ? 'text-emerald-600' : 'text-slate-400'}`}>
                            {unlocked ? "✓ Unlocked" : `${m.days - currentStreak}d to unlock`}
                          </span>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>

            {/* Footer */}
            <div className="p-4 border-t border-slate-100 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/40 flex justify-end">
              <button onClick={onClose} className="px-5 py-2 rounded-xl bg-slate-900 text-white dark:bg-brand-600 font-bold">
                Close
              </button>
            </div>
          </div>
        </div>
      );
    };

    // ========================================================================
    // USER PROFILE SETUP ONBOARDING WIZARD
    // ========================================================================
    const ProfileSetupModal = ({ user, onClose, onComplete }) => {
      const [step, setStep] = useState(1);
      const [institution, setInstitution] = useState(user?.institution || '');
      const [field, setField] = useState(user?.field || '');
      const [bio, setBio] = useState(user?.bio || '');
      const [selectedInterests, setSelectedInterests] = useState([]);
      const [followingMap, setFollowingMap] = useState({});

      const sampleInterests = [
        "Cognitive Systems", "Philosophy of Mind", "Epistemology", 
        "Machine Intelligence", "Astrophysics", "Classical Literature", 
        "History of Science", "Quantum Computing", "Ethics & Technology"
      ];

      const suggestedScholars = store.getUsers().filter(u => u.id !== user?.id).slice(0, 3);

      const toggleInterest = (interest) => {
        setSelectedInterests(prev => 
          prev.includes(interest) ? prev.filter(i => i !== interest) : [...prev, interest]
        );
      };

      const handleFinish = () => {
        Object.keys(followingMap).forEach(targetId => {
          if (followingMap[targetId]) {
            store.toggleFollow(targetId);
          }
        });

        onComplete({
          institution: institution.trim() || "Independent Scholar",
          field: field.trim() || "Interdisciplinary Studies",
          bio: bio.trim() || "Scholar and reader exploring ideas on Scholaria."
        });
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white dark:bg-slate-900 rounded-3xl max-w-md w-full border border-slate-200 dark:border-slate-800 shadow-2xl flex flex-col max-h-[90vh] overflow-hidden text-xs">
            {/* Header */}
            <div className="p-5 border-b border-slate-100 dark:border-slate-800 text-center">
              <span className="text-3xl block mb-1">🎓</span>
              <h3 className="font-extrabold text-lg text-slate-900 dark:text-white">Academic Onboarding</h3>
              <p className="text-[11px] text-slate-400">Step {step} of 3 • Set up your scholarly profile</p>
            </div>

            {/* Body */}
            <div className="p-6 overflow-y-auto space-y-4 flex-1">
              {step === 1 && (
                <div className="space-y-3">
                  <h4 className="font-bold text-sm text-slate-900 dark:text-white">Academic Affiliation & Discipline</h4>
                  <p className="text-slate-500">Connecting your university and discipline helps customize your academic feed and recommendations.</p>
                  
                  <div>
                    <label className="text-[11px] font-semibold text-slate-600 dark:text-slate-300 block mb-1">University or Institution</label>
                    <input 
                      type="text" 
                      value={institution} 
                      onChange={(e) => setInstitution(e.target.value)} 
                      placeholder="e.g. Stanford University, MIT, Oxford" 
                      className="w-full p-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white" 
                    />
                  </div>

                  <div>
                    <label className="text-[11px] font-semibold text-slate-600 dark:text-slate-300 block mb-1">Field of Study or Discipline</label>
                    <input 
                      type="text" 
                      value={field} 
                      onChange={(e) => setField(e.target.value)} 
                      placeholder="e.g. Theoretical Physics, Ethics, Neuroscience" 
                      className="w-full p-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white" 
                    />
                  </div>
                </div>
              )}

              {step === 2 && (
                <div className="space-y-3">
                  <h4 className="font-bold text-sm text-slate-900 dark:text-white">Scholarly Bio & Research Interests</h4>
                  <p className="text-slate-500">Tell peers about your intellectual passions and current inquiries.</p>

                  <div>
                    <label className="text-[11px] font-semibold text-slate-600 dark:text-slate-300 block mb-1">Brief Academic Bio</label>
                    <textarea 
                      value={bio} 
                      onChange={(e) => setBio(e.target.value)} 
                      rows="3" 
                      placeholder="e.g. Doctoral student investigating formal semantics and cognitive logic..." 
                      className="w-full p-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white" 
                    />
                  </div>

                  <div>
                    <label className="text-[11px] font-semibold text-slate-600 dark:text-slate-300 block mb-1.5">Select Research Topics</label>
                    <div className="flex flex-wrap gap-1.5">
                      {sampleInterests.map(topic => (
                        <button
                          key={topic}
                          type="button"
                          onClick={() => toggleInterest(topic)}
                          className={`px-2.5 py-1 rounded-lg text-[11px] font-medium transition ${
                            selectedInterests.includes(topic) 
                              ? 'bg-brand-600 text-white' 
                              : 'bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-200'
                          }`}
                        >
                          {topic}
                        </button>
                      ))}
                    </div>
                  </div>
                </div>
              )}

              {step === 3 && (
                <div className="space-y-3">
                  <h4 className="font-bold text-sm text-slate-900 dark:text-white">Connect with Founding Scholars</h4>
                  <p className="text-slate-500">Follow scholars in your field to populate your initial home feed.</p>

                  <div className="space-y-2 pt-1">
                    {suggestedScholars.map(s => (
                      <div key={s.id} className="p-3 rounded-xl border border-slate-200 dark:border-slate-800 flex items-center justify-between">
                        <div className="flex items-center gap-2.5">
                          <img src={s.avatar} alt={s.name} className="w-8 h-8 rounded-full object-cover" />
                          <div>
                            <h5 className="font-bold text-xs text-slate-900 dark:text-white">{s.name}</h5>
                            <p className="text-[10px] text-slate-400">{s.institution} • {s.field}</p>
                          </div>
                        </div>
                        <button
                          type="button"
                          onClick={() => setFollowingMap(prev => ({ ...prev, [s.id]: !prev[s.id] }))}
                          className={`px-3 py-1 rounded-lg font-semibold text-xs ${
                            followingMap[s.id] 
                              ? 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300' 
                              : 'bg-brand-600 text-white'
                          }`}
                        >
                          {followingMap[s.id] ? "Following ✓" : "+ Follow"}
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>

            {/* Footer */}
            <div className="p-4 border-t border-slate-100 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/40 flex justify-between">
              {step > 1 ? (
                <button 
                  type="button" 
                  onClick={() => setStep(s => s - 1)} 
                  className="px-4 py-2 rounded-xl border font-semibold"
                >
                  Back
                </button>
              ) : (
                <button 
                  type="button" 
                  onClick={onClose} 
                  className="px-4 py-2 rounded-xl text-slate-400 hover:text-slate-600"
                >
                  Skip Setup
                </button>
              )}

              {step < 3 ? (
                <button 
                  type="button" 
                  onClick={() => setStep(s => s + 1)} 
                  className="px-5 py-2 rounded-xl bg-slate-900 text-white dark:bg-brand-600 font-bold"
                >
                  Next →
                </button>
              ) : (
                <button 
                  type="button" 
                  onClick={handleFinish} 
                  className="px-5 py-2 rounded-xl bg-gradient-to-r from-slate-900 to-blue-900 hover:from-slate-800 hover:to-blue-800 text-white font-extrabold shadow-md"
                >
                  Enter Scholaria 🚀
                </button>
              )}
            </div>
          </div>
        </div>
      );
    };

    // Render the React application into #root
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
