<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scholaria - Read. Write. Research. Grow.</title>
  <meta name="description" content="The premier educational library and academic social network for students, teachers, educators, and researchers worldwide.">
  
  <!-- Fonts: Inter for UI, Merriweather for Academic Reading -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            serif: ['Merriweather', 'Georgia', 'serif'],
            mono: ['Fira Code', 'monospace']
          },
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              200: '#bfdbfe',
              300: '#93c5fd',
              400: '#60a5fa',
              500: '#3b82f6',
              600: '#2563eb', // Royal Academic Blue
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a',
              950: '#0f172a'  // Deep Navy
            },
            streak: {
              gold: '#F59E0B',
              amber: '#D97706',
              emerald: '#10B981'
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.4); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(100, 116, 139, 0.6); }
    
    .reader-mode-light { background-color: #ffffff; color: #1e293b; }
    .reader-mode-sepia { background-color: #fbf0d9; color: #433422; }
    .reader-mode-dark { background-color: #0f172a; color: #e2e8f0; }

    /* Animation effects */
    @keyframes pulseStreak {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    .flame-pulse {
      animation: pulseStreak 2s infinite ease-in-out;
    }
  </style>
</head>
<body class="h-full bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans antialiased selection:bg-blue-100 selection:text-blue-900 dark:selection:bg-blue-900 dark:selection:text-blue-100">
  <div id="root" class="h-full"></div>

  <!-- Preload ES Modules for Window Binding -->
  <script type="module" src="./src/config.js"></script>
  <script type="module" src="./src/services/store.js"></script>

  <!-- APPLICATION CODE -->
  <script type="text/babel" data-type="module">
    import { BRAND_CONFIG as CFG } from './src/config.js';
    import { store as ST } from './src/services/store.js';

    const BRAND_CONFIG = CFG || window.BRAND_CONFIG;
    const store = ST || window.store;

    const { useState, useEffect, useMemo, useRef } = React;

    // ========================================================================
    // SVG ICONS LIBRARY (High-performance, Crisp & Accessible)
    // ========================================================================
    const Icon = ({ name, className = "w-5 h-5", size = 20 }) => {
      const icons = {
        book: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />,
        home: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />,
        article: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z" />,
        research: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />,
        search: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />,
        bell: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />,
        dashboard: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />,
        user: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />,
        settings: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />,
        shield: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />,
        plus: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4" />,
        heart: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />,
        comment: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />,
        repost: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />,
        bookmark: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" />,
        share: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" />,
        flag: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 21v-4m0 0V5a2 2 0 012-2h6.5l1 1H21l-3 6 3 6h-8.5l-1-1H5a2 2 0 00-2 2zm9-13.5V9" />,
        moon: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />,
        sun: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />,
        check: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7" />,
        x: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />,
       
        eye: <><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></>,

        eyeOff: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />,
        clock: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />,
        filter: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" />,
        chevronRight: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7" />,
        chevronLeft: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 19l-7-7 7-7" />,
        arrowRight: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />,
        menu: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16" />
      };

      return (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor">
          {icons[name] || icons.book}
        </svg>
      );
    };

    // ========================================================================
    // TOAST NOTIFICATION COMPONENT
    // ========================================================================
    const Toast = ({ message, type = 'info', onClose }) => {
      if (!message) return null;
      return (
        <div className="fixed bottom-6 right-6 z-50 flex items-center gap-3 px-5 py-3.5 bg-slate-900 text-white dark:bg-slate-100 dark:text-slate-900 rounded-xl shadow-2xl border border-slate-700/50 dark:border-slate-300 text-sm font-medium animate-bounce">
          <span className="text-emerald-400 dark:text-emerald-600 font-bold">✓</span>
          <span>{message}</span>
          <button onClick={onClose} className="ml-2 opacity-60 hover:opacity-100">
            <Icon name="x" className="w-4 h-4" />
          </button>
        </div>
      );
    };

    // ========================================================================
    // LOGO BRAND COMPONENT
    // ========================================================================
    const BrandLogo = ({ onClick }) => (
      <button onClick={onClick} className="flex items-center gap-2.5 text-left group transition">
        <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-slate-900 via-brand-900 to-blue-700 dark:from-blue-600 dark:to-indigo-800 flex items-center justify-center text-white shadow-md shadow-blue-500/10 group-hover:scale-105 transition">
          <Icon name="book" className="w-5 h-5 text-amber-300" />
        </div>
        <div>
          <div className="flex items-center gap-1.5">
            <span className="font-extrabold tracking-tight text-xl text-slate-900 dark:text-white font-sans">
              {BRAND_CONFIG.name}
            </span>
            <span className="text-[10px] font-bold px-1.5 py-0.5 rounded bg-blue-100 text-blue-800 dark:bg-blue-900/60 dark:text-blue-300 uppercase tracking-wider">
              Academic
            </span>
          </div>
          <p className="text-[11px] font-medium text-slate-500 dark:text-slate-400 tracking-tight -mt-0.5 hidden sm:block">
            {BRAND_CONFIG.tagline}
          </p>
        </div>
      </button>
    );

    // ========================================================================
    // MAIN APP COMPONENT
    // ========================================================================
    function App() {
      // Store state
      const [currentUser, setCurrentUser] = useState(() => store.getCurrentUser());
      const [theme, setTheme] = useState(() => store.getTheme());
      const [activeTab, setActiveTab] = useState('feed'); // feed, library, articles, research, search, notifs, dashboard, profile, settings, admin
      
      // Secondary state
      const [feedFilter, setFeedFilter] = useState('for_you'); // for_you, following, latest, trending
      const [selectedCategory, setSelectedCategory] = useState('all');
      const [toastMsg, setToastMsg] = useState('');
      
      // Modals & Enhanced Interactive Views
      const [isComposerOpen, setIsComposerOpen] = useState(false);
      const [editingPost, setEditingPost] = useState(null);
      const [resumingDraft, setResumingDraft] = useState(null);
      const [isAuthOpen, setIsAuthOpen] = useState(false);
      const [authMode, setAuthMode] = useState('login'); // login, signup, forgot
      const [onboardingUser, setOnboardingUser] = useState(null);
      const [activeReaderBook, setActiveReaderBook] = useState(null);
      const [activeBookDetails, setActiveBookDetails] = useState(null);
      const [reportingPost, setReportingPost] = useState(null);
      const [isGuidelinesOpen, setIsGuidelinesOpen] = useState(false);
      const [editingProfileUser, setEditingProfileUser] = useState(null);
      const [articleDetailPost, setArticleDetailPost] = useState(null);
      const [activeCommentDrawerPost, setActiveCommentDrawerPost] = useState(null);
      const [activeRepostModalPost, setActiveRepostModalPost] = useState(null);
      const [activeUserListModal, setActiveUserListModal] = useState(null);
      const [isStreakHistoryOpen, setIsStreakHistoryOpen] = useState(false);
      const [viewingProfileUser, setViewingProfileUser] = useState(null);

      // Subscribe to central reactive store
      useEffect(() => {
        const unsub = store.subscribe(() => {
          setCurrentUser(store.getCurrentUser());
          setTheme(store.getTheme());
        });
        return unsub;
      }, []);

      // Synchronize dark mode class
      useEffect(() => {
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [theme]);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 3200);
      };

      const toggleTheme = () => {
        const next = theme === 'dark' ? 'light' : 'dark';
        store.setTheme(next);
      };

      const handleRequireAuth = (actionName = "perform this action") => {
        if (!currentUser) {
          setAuthMode('login');
          setIsAuthOpen(true);
          return false;
        }
        return true;
      };

      const handleOpenUserProfile = (userOrId) => {
        if (!userOrId) return;
        if (typeof userOrId === 'object' && userOrId.id) {
          setViewingProfileUser(userOrId);
        } else {
          const u = store.getUsers().find(x => x.id === userOrId);
          setViewingProfileUser(u || null);
        }
        setActiveTab('profile');
      };

      // Unread notifications count
      const unreadNotifsCount = useMemo(() => {
        if (!currentUser) return 0;
        return store.getNotifications().filter(n => !n.read).length;
      }, [currentUser, activeTab]);

      return (
        <div className="min-h-screen flex flex-col bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 transition-colors">
          {/* TOP APP HEADER */}
          <header className="sticky top-0 z-40 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 transition">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
              {/* Brand Logo */}
              <BrandLogo onClick={() => setActiveTab('feed')} />

              {/* Quick Search Header Widget */}
              <div className="hidden md:flex flex-1 max-w-md mx-6">
                <div 
                  onClick={() => setActiveTab('search')}
                  className="w-full flex items-center gap-2.5 px-3.5 py-2 bg-slate-100 hover:bg-slate-200/80 dark:bg-slate-800 dark:hover:bg-slate-800/80 rounded-xl cursor-pointer text-slate-500 dark:text-slate-400 text-sm border border-transparent hover:border-slate-300 dark:hover:border-slate-700 transition"
                >
                  <Icon name="search" className="w-4 h-4 text-slate-400" />
                  <span>Search books, articles, preprints, scholars...</span>
                  <kbd className="ml-auto text-[10px] px-1.5 py-0.5 rounded bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 font-mono text-slate-400">⌘K</kbd>
                </div>
              </div>

              {/* Right Action Tools */}
              <div className="flex items-center gap-3">
                {/* Daily Learning Streak Badge */}
                {currentUser && (
                  <button 
                    onClick={() => setIsStreakHistoryOpen(true)}
                    title={`Verified ${currentUser.streakDays}-Day Learning Streak! Click to view activity history.`}
                    className="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-amber-50 dark:bg-amber-950/40 text-amber-700 dark:text-amber-400 border border-amber-200 dark:border-amber-800/60 font-semibold text-xs transition hover:scale-105"
                  >
                    <span className="flame-pulse text-sm">🔥</span>
                    <span>{currentUser.streakDays}d Streak</span>
                    {currentUser.streakCompletedToday && (
                      <span className="w-2 h-2 rounded-full bg-emerald-500" title="Completed Today" />
                    )}
                  </button>
                )}

                {/* Notifications Bell */}
                {currentUser && (
                  <button
                    onClick={() => setActiveTab('notifs')}
                    className="relative p-2 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition"
                    title="Notifications"
                  >
                    <Icon name="bell" className="w-5 h-5" />
                    {unreadNotifsCount > 0 && (
                      <span className="absolute top-1 right-1 w-4 h-4 rounded-full bg-rose-500 text-white text-[10px] font-bold flex items-center justify-center animate-pulse">
                        {unreadNotifsCount}
                      </span>
                    )}
                  </button>
                )}

                {/* Theme Toggle (Light/Dark) */}
                <button
                  onClick={toggleTheme}
                  className="p-2 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition"
                  title={`Switch to ${theme === 'dark' ? 'Light' : 'Dark'} Mode`}
                >
                  <Icon name={theme === 'dark' ? 'sun' : 'moon'} className="w-5 h-5 text-amber-500 dark:text-amber-400" />
                </button>

                {/* Create Post Button */}
                <button
                  onClick={() => {
                    if (handleRequireAuth("create a post")) {
                      setIsComposerOpen(true);
                    }
                  }}
                  className="hidden sm:flex items-center gap-2 px-4 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-white dark:bg-brand-600 dark:hover:bg-brand-500 text-sm font-semibold shadow-md shadow-slate-900/10 transition active:scale-95"
                >
                  <Icon name="plus" className="w-4 h-4 text-amber-300" />
                  <span>Create Post</span>
                </button>

                {/* User Dropdown / Switcher or Login Button */}
                {currentUser ? (
                  <UserAccountMenu 
                    user={currentUser} 
                    onProfile={() => {
                      setViewingProfileUser(null);
                      setActiveTab('profile');
                    }} 
                    onDashboard={() => setActiveTab('dashboard')}
                    onSettings={() => setActiveTab('settings')}
                    onAdmin={() => setActiveTab('admin')}
                    onLogout={() => {
                      store.logout();
                      showToast("Signed out successfully.");
                    }}
                  />
                ) : (
                  <div className="flex items-center gap-2">
                    <button
                      onClick={() => { setAuthMode('login'); setIsAuthOpen(true); }}
                      className="px-3.5 py-1.5 rounded-xl text-sm font-medium text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition"
                    >
                      Log in
                    </button>
                    <button
                      onClick={() => { setAuthMode('signup'); setIsAuthOpen(true); }}
                      className="px-3.5 py-1.5 rounded-xl text-sm font-semibold bg-brand-600 hover:bg-brand-500 text-white shadow-sm transition"
                    >
                      Sign Up
                    </button>
                  </div>
                )}
              </div>
            </div>
          </header>

          {/* MAIN APPLICATION BODY (Sidebar + Content View) */}
          <div className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 flex gap-8">
            {/* DESKTOP NAVIGATION SIDEBAR */}
            <aside className="hidden lg:block w-64 shrink-0">
              <nav className="sticky top-24 space-y-1.5 bg-white dark:bg-slate-900 p-3 rounded-2xl border border-slate-200/80 dark:border-slate-800/80 shadow-sm">
                <NavItem icon="home" label="Home" active={activeTab === 'feed'} onClick={() => setActiveTab('feed')} />

                <div className="flex items-center gap-2 flex-wrap">
                  <h4 
                    onClick={() => onViewProfile(post.authorId)} 
                    className="font-bold text-slate-900 dark:text-white text-sm hover:underline cursor-pointer"
                  >
                    {post.authorName}
                  </h4>
                  <span className="text-xs text-slate-400">@{post.authorUsername}</span>
                </div>
                <p className="text-xs text-slate-500 dark:text-slate-400 line-clamp-1">
                  {post.authorInstitution} {post.authorRole ? `• ${post.authorRole}` : ''}
                </p>
              </div>
            </div>

            {/* Category badge & metadata */}
            <div className="flex items-center gap-2">
              <span className="inline-flex items-center gap-1 text-[11px] font-semibold px-2.5 py-1 rounded-full bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300">
                <span>{catConfig.icon}</span>
                <span>{post.categoryLabel || catConfig.label}</span>
              </span>
              {currentUser && (currentUser.id === post.authorId || currentUser.role === 'admin') && (
                <div className="flex items-center gap-1">
                  {currentUser.id === post.authorId && onEdit && (
                    <button 
                      onClick={() => onEdit(post)} 
                      title="Edit publication" 
                      className="px-2 py-0.5 rounded text-[11px] font-semibold text-slate-500 hover:text-brand-600 hover:bg-slate-100 dark:hover:bg-slate-800 transition"
                    >
                      Edit
                    </button>
                  )}
                  <button 
                    onClick={() => onDelete(post.id)} 
                    title="Delete post" 
                    className="p-1 rounded text-slate-400 hover:text-rose-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition"
                  >
                    <Icon name="x" className="w-4 h-4" />
                  </button>
                </div>
              )}
            </div>
          </div>

          {/* PUBLICATION TIMELINE & READING TIME */}
          <div className="flex items-center gap-2 text-xs text-slate-400 dark:text-slate-500 mb-3">
            <span>{post.publishedAt}</span>
            <span>•</span>
            <span className="flex items-center gap-1">
              <Icon name="clock" className="w-3.5 h-3.5" />
              {post.readingTime || "5 min read"}
            </span>
          </div>

          {/* ================================================================ */}
          {/* CRITICAL REQUIREMENT: TITLE MUST APPEAR BEFORE THE PREVIEW */}
          {/* ================================================================ */}
          <h2 
            onClick={() => onOpenDetail ? onOpenDetail(post) : setIsExpanded(!isExpanded)}
            className="text-lg sm:text-xl font-bold tracking-tight text-slate-900 dark:text-white mb-2 leading-snug cursor-pointer hover:text-brand-600 dark:hover:text-blue-400 transition"
          >
            {post.title}
          </h2>

          {/* ARTICLE CONTENT PREVIEW / EXPANDED CONTENT */}
          <div className="text-slate-700 dark:text-slate-300 text-sm leading-relaxed mb-4">
            {isExpanded ? (
              <div className="space-y-3 whitespace-pre-line font-sans">
                {post.content}
              </div>
            ) : (
              <p className="line-clamp-3 font-sans text-slate-600 dark:text-slate-300">
                {post.preview || post.content.substring(0, 220) + '...'}
              </p>
            )}

            {/* Read More & Full Detail options */}
            <div className="flex items-center gap-3 mt-2">
              <button
                onClick={() => setIsExpanded(!isExpanded)}
                className="text-xs font-semibold text-slate-500 dark:text-slate-400 hover:underline flex items-center gap-1"
              >
                <span>{isExpanded ? 'Collapse' : 'Expand Preview'}</span>
              </button>
              {onOpenDetail && (
                <button
                  onClick={() => onOpenDetail(post)}
                  className="text-xs font-semibold text-brand-600 dark:text-blue-400 hover:underline flex items-center gap-1"
                >
                  <span>Open Full Article Page</span>
                  <Icon name="chevronRight" className="w-3.5 h-3.5" />
                </button>
              )}
            </div>
          </div>

          {/* RESEARCH METADATA PANEL (If category is Research) */}
          {post.researchData && (
            <div className="mb-4 p-4 rounded-xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200/80 dark:border-slate-800 text-xs space-y-2">
              <div className="flex items-center justify-between">
                <span className="font-bold text-slate-800 dark:text-slate-200 uppercase tracking-wider text-[10px]">
                  🔬 Academic Preprint Metadata
                </span>
                {post.researchData.doi && (
                  <span className="font-mono text-slate-400 text-[10px]">DOI: {post.researchData.doi}</span>
                )}
              </div>
              <p className="text-slate-600 dark:text-slate-400 italic">
                <strong>Abstract:</strong> {post.researchData.abstract}
              </p>
              {post.researchData.keywords && post.researchData.keywords.length > 0 && (
                <div className="flex items-center gap-1.5 flex-wrap pt-1">
                  <span className="text-slate-400 text-[11px]">Keywords:</span>
                  {post.researchData.keywords.map((kw, idx) => (
                    <span key={idx} className="px-2 py-0.5 rounded-md bg-blue-50 dark:bg-blue-900/40 text-blue-700 dark:text-blue-300 text-[10px] font-medium">
                      #{kw}
                    </span>
                  ))}
                </div>
              )}
            </div>
          )}

          {/* ATTACHED IMAGE (If present) */}
          {post.image && (
            <div className="mb-4 rounded-xl overflow-hidden border border-slate-200 dark:border-slate-800 max-h-96">
              <img src={post.image} alt={post.title} className="w-full h-full object-cover hover:scale-101 transition" />
            </div>
          )}

          {/* INTERACTIVE ACTION BAR (Like, Comment, Repost, Bookmark, Share, Report) */}
          <div className="pt-3 border-t border-slate-100 dark:border-slate-800/80 flex items-center justify-between text-xs text-slate-500 dark:text-slate-400">
            <div className="flex items-center gap-1 sm:gap-4">
              {/* Like Button */}
              <button
                onClick={() => onLike(post.id)}
                className={`flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg transition ${
                  post.isLiked 
                    ? 'text-rose-600 dark:text-rose-400 font-bold bg-rose-50 dark:bg-rose-950/40' 
                    : 'hover:bg-slate-100 dark:hover:bg-slate-800'
                }`}
                title="Like"
              >
                <Icon name="heart" className={`w-4 h-4 ${post.isLiked ? 'fill-current' : ''}`} />
                <span>{post.likesCount || 0}</span>
              </button>

              {/* Comment Button */}
              <button
                onClick={() => onOpenComments(post)}
                className="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition"
                title="Academic Comments"
              >
                <Icon name="comment" className="w-4 h-4" />
                <span>{post.commentsCount || (post.comments ? post.comments.length : 0)}</span>
              </button>

              {/* Repost Button */}
              <button
                onClick={() => onOpenRepost(post)}
                className={`flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg transition ${
                  post.isReposted 
                    ? 'text-emerald-600 dark:text-emerald-400 font-bold bg-emerald-50 dark:bg-emerald-950/40' 
                    : 'hover:bg-slate-100 dark:hover:bg-slate-800'
                }`}
                title="Repost with attribution"
              >
                <Icon name="repost" className="w-4 h-4" />
                <span>{post.repostsCount || 0}</span>
              </button>
            </div>

            <div className="flex items-center gap-1">
              {/* Save / Bookmark Button */}
              <button
                onClick={() => onSave(post.id)}
                className={`p-1.5 rounded-lg transition ${
                  post.saved 
                    ? 'text-brand-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-950/40' 
                    : 'hover:bg-slate-100 dark:hover:bg-slate-800'
                }`}
                title={post.saved ? "Saved" : "Save for later"}
              >
                <Icon name="bookmark" className={`w-4 h-4 ${post.saved ? 'fill-current' : ''}`} />
              </button>

              {/* Share Button */}
              <button
                onClick={() => onShare(post)}
                className="p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition"
                title="Share link"
              >
                <Icon name="share" className="w-4 h-4" />
              </button>

              {/* Report Button */}
              <button
                onClick={() => onReport(post)}
                className="p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-400 hover:text-rose-500 transition"
                title="Report academic violation"
              >
                <Icon name="flag" className="w-4 h-4" />
              </button>
            </div>
          </div>
        </article>
      );
    };

    // ========================================================================
    // HOME FEED VIEW
    // ========================================================================
    const FeedView = ({ 
      currentUser,
      feedFilter, 
      setFeedFilter, 
      selectedCategory, 
      setSelectedCategory,
      onOpenComposer,
      onOpenReader,
      onRequireAuth,
      onShowToast,
      onReportPost,
      onOpenComments,
      onOpenRepost,
      onViewProfile,
      onOpenDetail,
      onEditPost
    }) => {
      const posts = store.getPosts();

      // Filter logic: For You, Following, Latest, Trending
      const filteredPosts = useMemo(() => {
        let list = [...posts];

        if (feedFilter === 'following') {
          if (!currentUser || !currentUser.followingIds) return [];
          list = list.filter(p => currentUser.followingIds.includes(p.authorId));
        } else if (feedFilter === 'trending') {
          list.sort((a, b) => ((b.likesCount || 0) + (b.repostsCount || 0)) - ((a.likesCount || 0) + (a.repostsCount || 0)));
        }

        if (selectedCategory !== 'all') {
          list = list.filter(p => p.category === selectedCategory);
        }

        return list;
      }, [posts, feedFilter, selectedCategory, currentUser]);

      const handleLike = (postId) => {
        if (!onRequireAuth("like this post")) return;
        store.toggleLike(postId);
      };

      const handleSave = (postId) => {
        if (!onRequireAuth("save this post")) return;
        const isSaved = store.toggleSavePost(postId);
        onShowToast(isSaved ? "Saved to your Reading Shelf." : "Removed from saved posts.");
      };

      const handleShare = (post) => {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(`${window.location.origin}/post/${post.id}`);
        }
        onShowToast("Post link copied to clipboard!");
      };

      const handleDelete = (postId) => {
        try {
          store.deletePost(postId);
          onShowToast("Post removed.");
        } catch (err) {
          onShowToast(err.message);
        }
      };

      return (
        <div className="space-y-6">
          {/* FEED HERO / COMPOSER TRIGGER */}
          <div className="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/80 dark:border-slate-800 p-4 sm:p-5 shadow-sm">
            <div className="flex items-center gap-3">
              <img 
                src={currentUser ? currentUser.avatar : "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80"} 
                alt="Avatar" 
                className="w-10 h-10 rounded-full object-cover border border-slate-200 dark:border-slate-700" 
              />
              <button
                onClick={onOpenComposer}
                className="flex-1 text-left px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200/80 dark:bg-slate-800 dark:hover:bg-slate-700/80 text-slate-500 dark:text-slate-400 text-sm border border-transparent transition"
              >
                Share an academic discovery, study notes, or research idea...
              </button>
              <button
                onClick={onOpenComposer}
                className="px-4 py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white dark:bg-brand-600 dark:hover:bg-brand-500 font-semibold text-xs transition"
              >
                + Post
              </button>
            </div>
          </div>

          {/* FEED TABS & CATEGORY FILTERS */}
          <div className="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/80 dark:border-slate-800 p-3 shadow-sm space-y-3">
            {/* Primary Filter Tabs: For You, Following, Latest, Trending */}
            <div className="flex items-center gap-1 border-b border-slate-100 dark:border-slate-800 pb-2">
              {[
                { id: 'for_you', label: 'For You', icon: '🌟' },
                { id: 'following', label: 'Following', icon: '👥' },
                { id: 'latest', label: 'Latest', icon: '⏱️' },
                { id: 'trending', label: 'Trending', icon: '🔥' },
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => setFeedFilter(tab.id)}
                  className={`flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl text-xs font-semibold transition ${
                    feedFilter === tab.id 
                      ? 'bg-slate-900 text-white dark:bg-brand-600 dark:text-white shadow-sm' 
                      : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'
                  }`}
                >
                  <span>{tab.icon}</span>
                  <span>{tab.label}</span>
                </button>
              ))}
            </div>

            {/* Category Chips Scrollbar */}
            <div className="flex items-center gap-1.5 overflow-x-auto pb-1 text-xs">
              <button
                onClick={() => setSelectedCategory('all')}
                className={`px-3 py-1 rounded-lg shrink-0 font-medium transition ${
                  selectedCategory === 'all'
                    ? 'bg-blue-100 text-blue-800 dark:bg-blue-900/60 dark:text-blue-300 font-bold'
                    : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 hover:bg-slate-200'
                }`}
              >
                All Topics
              </button>
              {BRAND_CONFIG.postCategories.map(cat => (
                <button
                  key={cat.id}
                  onClick={() => setSelectedCategory(cat.id)}
                  className={`px-3 py-1 rounded-lg shrink-0 font-medium flex items-center gap-1 transition ${
                    selectedCategory === cat.id
                      ? 'bg-blue-100 text-blue-800 dark:bg-blue-900/60 dark:text-blue-300 font-bold'
                      : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 hover:bg-slate-200'
                  }`}
                >
                  <span>{cat.icon}</span>
                  <span>{cat.label}</span>
                </button>
              ))}
            </div>
          </div>

          {/* POSTS LIST */}
          <div className="space-y-4">
            {filteredPosts.length > 0 ? (
              filteredPosts.map(post => (
                <PostCard 
                  key={post.id} 
                  post={post}
                  currentUser={currentUser}
                  onLike={handleLike}
                  onSave={handleSave}
                  onOpenComments={onOpenComments}
                  onOpenRepost={onOpenRepost}
                  onReport={onReportPost}
                  onShare={handleShare}
                  onViewProfile={onViewProfile}
                  onDelete={handleDelete}
                  onEdit={onEditPost}
                  onOpenDetail={onOpenDetail}
                />
              ))
            ) : (
              <div className="text-center py-16 bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-8">
                <span className="text-4xl mb-3 block">📭</span>
                <h3 className="font-bold text-base text-slate-900 dark:text-white mb-1">No publications found</h3>
                <p className="text-xs text-slate-500 dark:text-slate-400 max-w-sm mx-auto mb-4">
                  {feedFilter === 'following' 
                    ? "You haven't followed any scholars yet, or your followed scholars haven't posted in this category."
                    : "No publications match the selected criteria."}
                </p>
                {feedFilter === 'following' && (
                  <button
                    onClick={() => setFeedFilter('for_you')}
                    className="px-4 py-2 rounded-xl bg-slate-900 text-white dark:bg-brand-600 text-xs font-semibold"
                  >
                    Explore For You Feed
                  </button>
                )}
              </div>
            )}
          </div>
        </div>
      );
    };

    // ========================================================================
    // ONLINE READING LIBRARY VIEW (~500 Books Catalog, Filters, Online Reader)
    // ========================================================================
    const LibraryView = ({ currentUser, onOpenReader, onRequireAuth, onShowToast }) => {
      const [searchQuery, setSearchQuery] = useState('');
      const [categoryFilter, setCategoryFilter] = useState('all');
      const [onlySaved, setOnlySaved] = useState(false);
      const [sortBy, setSortBy] = useState('popular'); // popular, title, year

      const books = store.getBooks();

      const filteredBooks = useMemo(() => {
        let list = [...books];

        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase();
          list = list.filter(b => b.title.toLowerCase().includes(q) || b.author.toLowerCase().includes(q));
        }

        if (categoryFilter !== 'all') {
          list = list.filter(b => b.category === categoryFilter);
        }

        if (onlySaved) {
          list = list.filter(b => b.saved);
        }

        if (sortBy === 'popular') {
          list.sort((a, b) => (b.readsCount || 0) - (a.readsCount || 0));
        } else if (sortBy === 'title') {
          list.sort((a, b) => a.title.localeCompare(b.title));
        }

        return list;
      }, [books, searchQuery, categoryFilter, onlySaved, sortBy]);

      // Currently reading books
      const continueReadingBooks = useMemo(() => {
        return books.filter(b => b.readingProgress && b.readingProgress > 0);
      }, [books]);

      const handleToggleSave = (bookId) => {
        if (!onRequireAuth("save books")) return;
        const saved = store.toggleSaveBook(bookId);
        onShowToast(saved ? "Book added to your private bookshelf." : "Removed from bookshelf.");
      };

      return (
        <div className="space-y-6">
          {/* LIBRARY HERO & ADVISORY BANNER */}
          <div className="bg-gradient-to-r from-slate-900 via-blue-950 to-slate-900 text-white rounded-3xl p-6 sm:p-8 shadow-lg border border-slate-800">
            <div className="max-w-2xl">
              <span className="text-amber-400 font-bold text-xs uppercase tracking-wider">
                🏛️ Open Digital Academic Library
              </span>
              <h1 className="text-2xl sm:text-3xl font-extrabold mt-1 tracking-tight">
                500+ Public Domain Masterworks
              </h1>
              <p className="mt-2 text-sm text-slate-300 leading-relaxed font-sans">
                Explore foundational scientific treatises, philosophical dialogues, and seminal literature. 
                Full browser reading with customizable typography, dark mode, and reading progress tracking.
              </p>

              {/* Legal Notice requirement */}
              <div className="mt-4 p-3 rounded-xl bg-blue-900/40 border border-blue-700/50 text-xs text-blue-200 flex items-start gap-2.5">
                <span className="text-amber-300 font-bold">ℹ️</span>
                <span>
                  <strong>Legal Reading Notice:</strong> All volumes in this collection are public domain, openly licensed, or authorized OER. 
                  Online browser reading is provided free for educational research; downloading and commercial redistribution are disabled.
                </span>
              </div>
            </div>
          </div>

          {/* CONTINUE READING SHELF (If active) */}
          {continueReadingBooks.length > 0 && (
            <div className="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/80 dark:border-slate-800 p-5 shadow-sm">
              <div className="flex items-center justify-between mb-4">
                <h3 className="font-bold text-sm text-slate-900 dark:text-white flex items-center gap-2">
                  <span>📖</span>
                  <span>Continue Reading ({continueReadingBooks.length})</span>
                </h3>
                <span className="text-xs text-slate-400">Syncs with Daily Streak</span>
              </div>
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                {continueReadingBooks.map(b => (
                  <div key={b.id} className="p-3 rounded-xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700/60 flex gap-3 items-center">
                    <img src={b.cover} alt={b.title} className="w-14 h-20 object-cover rounded-lg shadow-sm" />
                    <div className="flex-1 min-w-0">
                      <h4 className="font-bold text-xs text-slate-900 dark:text-white truncate">{b.title}</h4>
                      <p className="text-[11px] text-slate-500 truncate">{b.author}</p>
                      <div className="mt-2">
                        <div className="flex justify-between text-[10px] text-slate-400 mb-1">
                          <span>Progress</span>
                          <span>{b.readingProgress}%</span>
                        </div>
                        <div className="w-full bg-slate-200 dark:bg-slate-700 h-1.5 rounded-full overflow-hidden">
                          <div className="bg-brand-600 h-full rounded-full" style={{ width: `${b.readingProgress}%` }} />
                        </div>
                      </div>
                      <button 
                        onClick={() => onOpenReader(b)} 
                        className="mt-2.5 w-full py-1 text-[11px] font-semibold bg-slate-900 text-white dark:bg-brand-600 rounded-md hover:opacity-90"
                      >
                        Resume Reading
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* SEARCH, CATEGORY TABS & CONTROLS */}
          <div className="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/80 dark:border-slate-800 p-4 shadow-sm space-y-3">
            <div className="flex flex-col sm:flex-row gap-3 items-center justify-between">
              {/* Search Bar */}
              <div className="relative w-full sm:w-96">
                <Icon name="search" className="w-4 h-4 absolute left-3.5 top-3 text-slate-400" />
                <input 
                  type="text" 
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  placeholder="Search 500 books by title or author..."
                  className="w-full pl-9 pr-4 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs sm:text-sm text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-500"
                />
                {searchQuery && (
                  <button onClick={() => setSearchQuery('')} className="absolute right-3 top-3 text-slate-400">
                    <Icon name="x" className="w-3.5 h-3.5" />
                  </button>
                )}
              </div>

              {/* Controls */}
              <div className="flex items-center gap-2 w-full sm:w-auto justify-between sm:justify-end text-xs">
                <button
                  onClick={() => setOnlySaved(!onlySaved)}
                  className={`px-3 py-2 rounded-xl font-medium border transition ${
                    onlySaved 
                      ? 'bg-blue-50 border-blue-300 text-blue-700 dark:bg-blue-900/40 dark:border-blue-700 dark:text-blue-300 font-bold'
                      : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800'
                  }`}
                >
                  🔖 My Bookshelf
                </button>

                <select
                  value={sortBy}
                  onChange={(e) => setSortBy(e.target.value)}
                  className="px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 text-xs focus:outline-none"
                >
                  <option value="popular">Most Read</option>
                  <option value="title">Alphabetical (Title)</option>
                </select>
              </div>
            </div>

            {/* Subject Filters */}
            <div className="flex items-center gap-1.5 overflow-x-auto pb-1 text-xs">
              {BRAND_CONFIG.bookCategories.map(cat => (
                <button
                  key={cat.id}
                  onClick={() => setCategoryFilter(cat.id)}
                  className={`px-3 py-1.5 rounded-xl shrink-0 font-medium flex items-center gap-1.5 transition ${
                    categoryFilter === cat.id 
                      ? 'bg-slate-900 text-white dark:bg-brand-600 dark:text-white font-bold'
                      : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 hover:bg-slate-200'
                  }`}
                >
                  <span>{cat.icon}</span>
                  <span>{cat.label}</span>
                </button>
              ))}
            </div>
          </div>

          {/* BOOKS GRID (Showing matched titles from the 500-book initial collection) */}
          <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 sm:gap-6">
            {filteredBooks.map(book => (
              <div 
                key={book.id}

    // ========================================================================

    const SearchView = ({ onOpenReader, onViewProfile }) => {

      const [activeType, setActiveType] = useState('all'); // all, books, articles, research, users

      const books = store.getBooks();
      const posts = store.getPosts();
      const users = store.getUsers();

      const results = useMemo(() => {
        if (!query.trim()) return { books: [], posts: [], users: [] };
        const q = query.toLowerCase();

        const matchedBooks = books.filter(b => b.title.toLowerCase().includes(q) || b.author.toLowerCase().includes(q) || b.description.toLowerCase().includes(q));
        const matchedPosts = posts.filter(p => p.title.toLowerCase().includes(q) || p.content.toLowerCase().includes(q) || p.authorName.toLowerCase().includes(q));
        const matchedUsers = users.filter(u => u.name.toLowerCase().includes(q) || u.username.toLowerCase().includes(q) || u.institution.toLowerCase().includes(q) || u.field.toLowerCase().includes(q));

        return { books: matchedBooks, posts: matchedPosts, users: matchedUsers };
      }, [query, books, posts, users]);

      const totalMatches = results.books.length + results.posts.length + results.users.length;

      return (
        <div className="space-y-6">
          {/* SEARCH INPUT BAR */}

            {/* Quick suggested chips */}

                  className="px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 text-slate-600 dark:text-slate-300 text-[11px]"

          {/* FILTER TABS */}

                { id: 'all', label: `All (${totalMatches})` },
                { id: 'books', label: `Books (${results.books.length})` },
                { id: 'posts', label: `Articles & Notes (${results.posts.length})` },
                { id: 'users', label: `Scholars (${results.users.length})` },
              ].map(tab => (
                <button

                  onClick={() => setActiveType(tab.id)}

                >

              ))}

          {/* RESULTS DISPLAY */}

              {/* BOOKS SECTION */}

                    {results.books.map(b => (
                      <div 
                        key={b.id}

                        <img src={b.cover} alt={b.title} className="w-12 h-16 object-cover rounded shadow" />
                        <div>
                          <span className="text-[10px] font-bold text-brand-600 uppercase">{b.categoryLabel}</span>
                          <h4 className="font-bold text-xs text-slate-900 dark:text-white line-clamp-1">{b.title}</h4>

                        </div>
                      </div>

                  </div>

              {/* POSTS SECTION */}
              {(activeType === 'all' || activeType === 'posts') && results.posts.length > 0 && (
                <div className="space-y-3">

                          <p className="text-[10px] text-brand-600 font-medium">{u.field}</p>

                  </div>

              {totalMatches === 0 && (
                <div className="text-center py-12 bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-8">

    // ========================================================================

    const ProfileView = ({ profileUser, currentUser, onEditProfile, onRequireAuth, onShowToast, onOpenDetail }) => {
      const [profileTab, setProfileTab] = useState('posts'); // posts, articles, research, reposts

      const targetUser = profileUser || currentUser;
      if (!targetUser) {
        return (
          <div className="p-8 text-center bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800">
            <p className="text-slate-500 text-sm">Please log in to view your profile or select a scholar to explore.</p>
          </div>
        );
      }

      const isOwnProfile = currentUser && currentUser.id === targetUser.id;
      const isFollowing = currentUser ? store.isFollowing(targetUser.id) : false;

      const posts = store.getPosts();
      const userPosts = posts.filter(p => p.authorId === targetUser.id && !p.isRepost);
      const userArticles = posts.filter(p => p.authorId === targetUser.id && p.category === 'article');
      const userResearch = posts.filter(p => p.authorId === targetUser.id && p.category === 'research');
      const userReposts = posts.filter(p => p.isRepost && p.repostedBy?.id === targetUser.id);

      const handleLike = (postId) => {
        if (!onRequireAuth("like")) return;
        store.toggleLike(postId);
      };

      const handleSave = (postId) => {
        if (!onRequireAuth("save")) return;
        const saved = store.toggleSavePost(postId);
        onShowToast(saved ? "Saved to your Reading Shelf." : "Removed from saved posts.");
      };

      const handleShare = (post) => {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(`${window.location.origin}/post/${post.id}`);
        }
        onShowToast("Post link copied to clipboard!");
      };

      const handleDelete = (postId) => {
        try {
          store.deletePost(postId);
          onShowToast("Post removed.");
        } catch (err) {
          onShowToast(err.message);
        }
      };

      return (
        <div className="space-y-6">
          {/* PROFILE HEADER CARD */}
          <div className="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/80 dark:border-slate-800 overflow-hidden shadow-sm">
            {/* Cover Banner */}
            <div className="h-40 sm:h-52 w-full overflow-hidden bg-slate-900 relative">
              <img src={targetUser.cover || "https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=1200&q=80"} alt="Cover" className="w-full h-full object-cover opacity-80" />
            </div>

            {/* Profile Meta Area */}

                  <img 
                    src={targetUser.avatar} 
                    alt={targetUser.name} 
                    className="w-24 h-24 sm:w-28 sm:h-28 rounded-2xl object-cover border-4 border-white dark:border-slate-900 shadow-md bg-white" 
                  />
                  <div className="mb-1">
                    <h1 className="text-xl sm:text-2xl font-extrabold text-slate-900 dark:text-white flex items-center gap-2">
                      <span>{targetUser.name}</span>
                      {targetUser.role === 'admin' && (
                        <span className="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-amber-100 text-amber-800 dark:bg-amber-900/60 dark:text-amber-300">
                          Admin
                        </span>
                      )}
                    </h1>
                    <p className="text-xs text-slate-400">@{targetUser.username} • Joined {targetUser.joinedDate || 'Recently'}</p>
                  </div>
                </div>

                {/* Profile Action: Edit Profile if own, or Follow button if another scholar */}
                {isOwnProfile ? (
                  <button
                    onClick={() => onEditProfile(targetUser)}
                    className="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-xs font-semibold text-slate-800 dark:text-slate-200 border border-slate-200 dark:border-slate-700 transition"
                  >
                    Edit Profile
                  </button>
                ) : (
                  <button
                    onClick={() => {
                      if (onRequireAuth("follow")) {
                        store.toggleFollow(targetUser.id);
                        onShowToast(isFollowing ? `Unfollowed @${targetUser.username}` : `Following @${targetUser.username}`);
                      }
                    }}
                    className={`px-4 py-2 rounded-xl text-xs font-bold transition shadow-sm ${
                      isFollowing
                        ? 'bg-slate-200 text-slate-800 dark:bg-slate-800 dark:text-slate-200 hover:bg-rose-100 hover:text-rose-700'
                        : 'bg-brand-600 hover:bg-brand-500 text-white'

                  >
                    {isFollowing ? '✓ Following' : '+ Follow Scholar'}
                  </button>

              </div>

              {/* Bio & Academic Affiliation */}
              <p className="text-xs sm:text-sm text-slate-700 dark:text-slate-300 leading-relaxed font-sans max-w-3xl mb-4">
                {targetUser.bio || 'Learner, researcher, and avid reader on Scholaria.'}
              </p>

              <div className="flex flex-wrap items-center gap-y-2 gap-x-4 text-xs text-slate-500 border-t border-slate-100 dark:border-slate-800 pt-3">
                <span className="flex items-center gap-1">
                  🏛️ <strong>{targetUser.institution || 'Independent Academic Scholar'}</strong>
                </span>
                <span>•</span>
                <span className="flex items-center gap-1">
                  🔬 <strong>{targetUser.field || 'General Studies'}</strong>
                </span>
                <span>•</span>
                <span className="flex items-center gap-1 text-amber-600 dark:text-amber-400 font-bold">
                  🔥 {targetUser.streakDays || 1}-Day Learning Streak
                </span>
              </div>

              {/* Followers and Following counters */}
              <div className="flex items-center gap-6 mt-4 text-xs font-medium">
                <div>
                  <strong className="text-slate-900 dark:text-white font-bold">{targetUser.followersCount || 0}</strong>
                  <span className="text-slate-400 ml-1">Followers</span>
                </div>
                <div>
                  <strong className="text-slate-900 dark:text-white font-bold">{targetUser.followingCount || 0}</strong>
                  <span className="text-slate-400 ml-1">Following</span>
                </div>
              </div>
            </div>
          </div>

          {/* PROFILE TABS: Posts, Articles, Research, Reposts */}

            <div className="flex items-center gap-2 text-xs">

                { id: 'articles', label: `Articles (${userArticles.length})` },

                    profileTab === t.id 
                      ? 'bg-slate-900 text-white dark:bg-brand-600 dark:text-white' 
                      : 'text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800'
                  }`}
                >
                  {t.label}
                </button>
              ))}
            </div>
          </div>

          {/* TAB CONTENTS */}
          <div className="space-y-4">
            {profileTab === 'posts' && (
              userPosts.length > 0 ? (
                userPosts.map(p => (
                  <PostCard key={p.id} post={p} currentUser={currentUser} onLike={() => handleLike(p.id)} onSave={() => handleSave(p.id)} onOpenComments={() => {}} onOpenRepost={() => {}} onReport={() => {}} onShare={() => handleShare(p)} onViewProfile={() => {}} onDelete={() => handleDelete(p.id)} />
                ))
              ) : (
                <div className="p-8 text-center text-xs text-slate-400 bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/80 dark:border-slate-800">
                  No posts published yet.
                </div>
              )
            )}
            {profileTab === 'articles' && (
              userArticles.length > 0 ? (
                userArticles.map(p => (
                  <PostCard key={p.id} post={p} currentUser={currentUser} onLike={() => handleLike(p.id)} onSave={() => handleSave(p.id)} onOpenComments={() => {}} onOpenRepost={() => {}} onReport={() => {}} onShare={() => handleShare(p)} onViewProfile={() => {}} onDelete={() => handleDelete(p.id)} />
                ))
              ) : (
                <div className="p-8 text-center text-xs text-slate-400 bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/80 dark:border-slate-800">
                  No academic articles published yet.
                </div>
              )
            )}
            {profileTab === 'research' && (
              userResearch.length > 0 ? (
                userResearch.map(p => (
                  <PostCard key={p.id} post={p} currentUser={currentUser} onLike={() => handleLike(p.id)} onSave={() => handleSave(p.id)} onOpenComments={() => {}} onOpenRepost={() => {}} onReport={() => {}} onShare={() => handleShare(p)} onViewProfile={() => {}} onDelete={() => handleDelete(p.id)} />
                ))
              ) : (
                <div className="p-8 text-center text-xs text-slate-400 bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/80 dark:border-slate-800">

            {profileTab === 'reposts' && (

                  <PostCard key={p.id} post={p} currentUser={currentUser} onLike={() => handleLike(p.id)} onSave={() => handleSave(p.id)} onOpenComments={() => {}} onOpenRepost={() => {}} onReport={() => {}} onShare={() => handleShare(p)} onViewProfile={() => {}} onDelete={() => handleDelete(p.id)} />
                ))
              ) : (
                <div className="p-8 text-center text-xs text-slate-400 bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/80 dark:border-slate-800">
                  No reposts shared yet.
                </div>

            )}

        </div>

            <span className="text-4xl block mb-2">🛡️</span>
            <h3 className="font-bold text-base text-rose-600">Administrative Authorization Required</h3>
            <p className="text-xs text-slate-500 mt-1">You must be signed in with an authorized Administrator account to access administrative tools.</p>
          </div>

              className="px-4 py-2 rounded-xl bg-brand-600 hover:bg-brand-500 text-xs font-bold text-white shadow"
            >

            </button>
          </div>

          <div className="flex items-center gap-2 border-b border-slate-200 dark:border-slate-800 pb-2 text-xs">
            {[
              { id: 'overview', label: 'Platform Overview' },
              { id: 'books', label: `Manage Books (${books.length})` },
              { id: 'reports', label: `Moderation Reports (${reports.filter(r => r.status === 'pending').length} pending)` },
              { id: 'users', label: `Users (${users.length})` },
            ].map(t => (
              <button
                key={t.id}
                onClick={() => setAdminTab(t.id)}
                className={`px-3.5 py-1.5 rounded-xl font-semibold transition ${
                  adminTab === t.id ? 'bg-slate-900 text-white dark:bg-brand-600 dark:text-white' : 'text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800'

    // ========================================================================
    // CREATE POST STEP-BY-STEP WORKFLOW COMPOSER MODAL

    // ========================================================================
    const PostComposerModal = ({ currentUser, initialPost, initialDraft, onClose, onSuccess, onSaveDraft }) => {
      const [step, setStep] = useState(initialPost ? 3 : (initialDraft ? 2 : 1));
      const [category, setCategory] = useState(initialPost?.category || initialDraft?.category || 'normal_post');
      const [title, setTitle] = useState(initialPost?.title || initialDraft?.title || '');
      const [content, setContent] = useState(initialPost?.content || initialDraft?.content || '');
      const [image, setImage] = useState(initialPost?.image || initialDraft?.image || '');
      const [previewMode, setPreviewMode] = useState(false);

      // Research specific fields
      const [researchAbstract, setResearchAbstract] = useState(initialPost?.abstract || '');
      const [researchField, setResearchField] = useState(initialPost?.researchField || currentUser?.field || '');
      const [researchKeywords, setResearchKeywords] = useState((initialPost?.keywords || []).join(', '));
      const [researchCitations, setResearchCitations] = useState((initialPost?.citations || []).join('\n'));

      const maxTitle = BRAND_CONFIG.maxTitleLength;

      const handlePublish = () => {
        if (!title.trim()) {
          alert("Please enter a title for your publication.");
          setStep(2);
          return;
        }
        if (!content.trim()) {
          alert("Please write the post content.");
          setStep(3);
          return;
        }

        const catObj = BRAND_CONFIG.postCategories.find(c => c.id === category);

        const payload = {
          category,
          categoryLabel: catObj ? catObj.label : "Post",
          title,
          content,
          image: image.trim() || null,
          abstract: researchAbstract,
          researchField,
          keywords: researchKeywords ? researchKeywords.split(',').map(k => k.trim()).filter(Boolean) : [],
          citations: researchCitations ? researchCitations.split('\n').map(c => c.trim()).filter(Boolean) : []
        };

        let result;
        if (initialPost) {
          result = store.editPost(initialPost.id, payload);
        } else {
          result = store.createPost(payload);
        }

        if (initialDraft?.id) {
          store.deleteDraft(initialDraft.id);
        }

        onSuccess(result);
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">

      const [readingTheme, setReadingTheme] = useState('light'); // light, sepia, dark
      const [fontSize, setFontSize] = useState(16); // 14, 16, 18, 22
      const [lineSpacing, setLineSpacing] = useState(1.8); // 1.5, 1.8, 2.2
      const [fontFamily, setFontFamily] = useState('serif'); // serif, sans
      const [currentChapterIdx, setCurrentChapterIdx] = useState(0);

      const chapters = book.chapters || [{ title: "Foundations", content: book.description }];
      const currentChapter = chapters[currentChapterIdx] || chapters[0];

      // Calculate progress percentage
      const progressPct = Math.round(((currentChapterIdx + 1) / chapters.length) * 100);

      // Session tracker: verified reading activity counts toward streak!
      useEffect(() => {
        onUpdateProgress(progressPct, currentChapter.title);
        const timer = setTimeout(() => {
          store.recordLearningActivity('reading');
        }, 15000); // 15 seconds marks verified active reading session
        return () => clearTimeout(timer);
      }, [currentChapterIdx]);

      const themeClass = {
        light: 'reader-mode-light',
        sepia: 'reader-mode-sepia',
        dark: 'reader-mode-dark'
      }[readingTheme];

      return (
        <div className="fixed inset-0 z-50 flex flex-col bg-slate-900/80 backdrop-blur-md">
          {/* READER TOP TOOLBAR */}
          <div className="h-16 px-6 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between text-xs shadow-sm">
            <div className="flex items-center gap-3">
              <button 
                onClick={onClose} 
                className="p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500 font-bold"
              >
                ✕ Close Reader
              </button>
              <div className="hidden sm:block">
                <h4 className="font-bold text-slate-900 dark:text-white line-clamp-1">{book.title}</h4>
                <p className="text-[11px] text-slate-400">By {book.author} • {book.categoryLabel}</p>
              </div>
            </div>

            {/* Typography & Theme Adjusters */}

              {/* Theme Mode Picker */}

                  onClick={() => setReadingTheme('light')}

                  title="Day Mode"
                >
                  White
                </button>
                <button 
                  onClick={() => setReadingTheme('sepia')} 
                  className={`px-2 py-1 rounded-lg font-semibold ${readingTheme === 'sepia' ? 'bg-[#fbf0d9] text-[#433422] shadow' : 'text-slate-500'}`}
                  title="Sepia Comfort Mode"
                >
                  Sepia
                </button>
                <button 
                  onClick={() => setReadingTheme('dark')} 
                  className={`px-2 py-1 rounded-lg font-semibold ${readingTheme === 'dark' ? 'bg-slate-900 text-white shadow' : 'text-slate-500'}`}
                  title="Dark Night Mode"
                >
                  Night
                </button>
              </div>

              {/* Font Size Adjuster */}
              <div className="flex items-center gap-1">
                <button 
                  onClick={() => setFontSize(f => Math.max(14, f - 2))} 
                  className="w-7 h-7 rounded-lg border flex items-center justify-center font-bold"
                  title="Decrease Font Size"
                >
                  A-

                <span className="text-[11px] font-mono">{fontSize}px</span>
                <button 
                  onClick={() => setFontSize(f => Math.min(24, f + 2))}

                  title="Increase Font Size"

                  A+

                {fontFamily === 'serif' ? 'Serif' : 'Sans'}

            <div className="bg-brand-600 h-full transition-all duration-300" style={{ width: `${progressPct}%` }} />
          </div>

          {/* READER CONTENT CANVAS */}
          <div className={`flex-1 overflow-y-auto ${themeClass} transition-colors p-6 sm:p-12`}>
            <div className="max-w-2xl mx-auto space-y-6">

    // ========================================================================
    // AUTHENTICATION MODAL (Real Auth State Machine with Demo Accounts & Password Recovery)
    // ========================================================================
    const AuthModal = ({ mode, setMode, onClose, onSuccess }) => {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [showPassword, setShowPassword] = useState(false);
      const [name, setName] = useState('');
      const [username, setUsername] = useState('');
      const [institution, setInstitution] = useState('');
      const [field, setField] = useState('');
      const [error, setError] = useState('');

      // 3-step password recovery state
      const [forgotStep, setForgotStep] = useState(1); // 1: request, 2: verify & change, 3: success
      const [forgotEmail, setForgotEmail] = useState('');
      const [resetCode, setResetCode] = useState('849201');
      const [newPassword, setNewPassword] = useState('');
      const [confirmPassword, setConfirmPassword] = useState('');

      const [isSubmitting, setIsSubmitting] = useState(false);

      const handleLogin = async (e) => {
        e?.preventDefault();
        setError('');
        setIsSubmitting(true);
        try {
          const user = await store.login(email, password);
          onSuccess(user, false);
        } catch (err) {
          setError(err.message || "Login failed.");
        } finally {
          setIsSubmitting(false);
        }
      };

      const handleSignup = async (e) => {
        e?.preventDefault();
        setError('');
        if (!name.trim() || !username.trim() || !email.trim() || !password.trim()) {
          setError("All required fields must be completed.");
          return;
        }
        setIsSubmitting(true);
        try {
          const user = await store.register({
            name,
            username,
            email,
            password,
            institution,
            field,
            role: "student"
          });
          onSuccess(user, true); // true = wasSignup (triggers onboarding wizard)
        } catch (err) {
          setError(err.message || "Registration failed.");
        } finally {
          setIsSubmitting(false);
        }
      };

      const handleRequestReset = (e) => {
        e?.preventDefault();
        setError('');
        if (!forgotEmail.trim()) {
          setError("Please enter your academic email address.");
          return;
        }
        // Simulated token dispatch
        setForgotStep(2);
      };

      const handleConfirmReset = async (e) => {
        e?.preventDefault();
        setError('');
        if (!resetCode.trim()) {
          setError("Please enter the verification code.");
          return;
        }
        if (newPassword.length < 6) {
          setError("New password must be at least 6 characters.");
          return;
        }
        if (newPassword !== confirmPassword) {
          setError("Passwords do not match.");
          return;
        }
        setIsSubmitting(true);
        try {
          await store.resetPassword(forgotEmail, resetCode, newPassword);
          setForgotStep(3);
        } catch (err) {
          setError(err.message || "Password reset failed.");
        } finally {
          setIsSubmitting(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white dark:bg-slate-900 rounded-3xl max-w-md w-full p-6 sm:p-8 border border-slate-200 dark:border-slate-800 shadow-2xl space-y-5 text-xs">

                <h3 className="font-extrabold text-lg text-slate-900 dark:text-white">
                  {mode === 'login' ? 'Welcome to Scholaria' : mode === 'signup' ? 'Join Scholaria Community' : 'Password Recovery'}
                </h3>
                <p className="text-slate-400 mt-0.5">Read. Write. Research. Grow.</p>
              </div>
              <button onClick={onClose} className="p-1 rounded text-slate-400 hover:text-slate-600">
                <Icon name="x" className="w-5 h-5" />
              </button>
            </div>

            {error && (
              <div className="p-3 rounded-xl bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-800 text-rose-700 dark:text-rose-300 font-medium">
                {error}
              </div>
            )}

            {/* SECURE EVALUATION CREDENTIALS (Submitted through real authenticated form) */}
       

            {/* FORM */}
            {mode === 'login' && (
              <form onSubmit={handleLogin} className="space-y-3">
                <div>
                  <label className="text-[11px] font-semibold text-slate-600 dark:text-slate-300 block mb-1">Email or Username</label>
                  <input 
                    type="text" 
                    value={email}
                    onChange={(e) => setEmail(e.target.value)}
                    placeholder="evelyn.vance@oxford.edu or @evelyn_vance"
                    className="w-full p-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white"
                    required
                  />
                </div>
                <div>
                  <label className="text-[11px] font-semibold text-slate-600 dark:text-slate-300 block mb-1">Password</label>
                  <div className="relative">
                    <input 
                      type={showPassword ? "text" : "password"}
                      value={password}
                      onChange={(e) => setPassword(e.target.value)}
                      placeholder="••••••••"
                      className="w-full p-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white pr-9"
                      required
                    />
                    <button
                      type="button"
                      onClick={() => setShowPassword(!showPassword)}
                      className="absolute right-2.5 top-2.5 text-slate-400 hover:text-slate-600"
                    >
                      <Icon name={showPassword ? 'eyeOff' : 'eye'} className="w-4 h-4" />
                    </button>
                  </div>
                </div>

                <div className="flex justify-between items-center text-[11px]">
                  <span className="text-slate-400">Remember session</span>
                  <button type="button" onClick={() => { setMode('forgot'); setForgotStep(1); }} className="text-brand-600 hover:underline">

                  <input type="text" value={username} onChange={(e) => setUsername(e.target.value)} placeholder="jane_doe" className="w-full p-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800" required />

                <div>
                  <label className="text-[11px] font-semibold text-slate-600 dark:text-slate-300 block mb-1">Academic Email *</label>
                  <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="jane.doe@university.edu" className="w-full p-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800" required />

                <div>

                  <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} placeholder="••••••••" className="w-full p-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800" required />

                  <input type="text" value={institution} onChange={(e) => setInstitution(e.target.value)} placeholder="Harvard, Oxford, etc." className="w-full p-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800" />
